# Evita que o Supabase gratuito pause o projeto por inatividade (regra: ~7 dias com pouca atividade).
# Faz uma chamada leve à função inv_is_admin (retorna false para anônimo) todo dia.
# Obs.: agendamentos só rodam na branch padrão (main).
name: keepalive-supabase
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          set -e
          KEY="sb_publishable_6uAKSWzfNolqRGxiXpBcEQ_RN8H3PR2"
          curl -fsS -X POST "https://wiujtvcmikrwnsxkpztv.supabase.co/rest/v1/rpc/inv_is_admin" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
